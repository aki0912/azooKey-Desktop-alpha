name: Swift Build and Test
on:
  push:
  pull_request:

jobs:
  auto-mixed-python:
    name: Test Mixed IME tooling and training
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned romanization table
        uses: actions/checkout@v4
        with:
          repository: azooKey/AzooKeyKanaKanjiConverter
          ref: ad714fea8cb2fe113aea86ba5c42563cdaf77cfb
          path: build/auto-mixed/core/checkouts/AzooKeyKanaKanjiConverter
          sparse-checkout: Sources/KanaKanjiConverterModule/InputManagement/InputTables/defaultRoman2Kana.swift
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Tools/AutoMixedTraining/requirements.lock
      - name: Install pinned training dependencies
        run: python -m pip install -r Tools/AutoMixedTraining/requirements.lock
      - name: Test build and installer contracts
        run: python -m unittest discover -s Tools/tests -p 'test_*.py'
      - name: Test training and evaluation contracts
        run: python -m unittest discover -s Tools/AutoMixedTraining -p 'test_*.py'

  macos-build:
    name: Build and Test on macOS
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.3
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.3*.app | head -n 1)
          echo "Using Xcode at $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  ubuntu-build:
    name: Build and Test on Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  xcodebuild-test:
    name: Xcodebuild test on macOS
    runs-on: macos-15
    steps:
      - name: Select Xcode 16.3
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.3*.app | head -n 1)
          echo "Using Xcode at $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify xcodebuild installation
        run: xcodebuild -version
      - name: List available schemes
        run: xcodebuild -project azooKeyMac.xcodeproj -list
      - name: Test building azooKeyMac (Release configuration)
        run: |
         xcodebuild \
          -project azooKeyMac.xcodeproj \
          -scheme azooKeyMac \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SwiftLint
        run: |
          brew update
          brew install swiftlint
      - name: Check SwiftLint version
        run: swiftlint version
      - name: Run SwiftLint
        run: |
          swiftlint --quiet --strict
  
